name: BUSHRA AI CI & Build APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Verify BUSHRA AI APK
    env:
      JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace -Djava.awt.headless=true

      - name: Run Unit Tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace -Djava.awt.headless=true

      - name: Prepare APK Artifact
        run: |
          APK_PATH=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK file was generated!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" "bushra-ai.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bushra-ai-apk
          path: bushra-ai.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          name: "BUSHRA AI — Release ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: bushra-ai.apk
          token: ${{ secrets.GITHUB_TOKEN }}
